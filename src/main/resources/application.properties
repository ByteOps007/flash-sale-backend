spring.application.name=flash-sale-engine

# --- Postgres (matches docker-compose.yml) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/flash_sale_db
spring.datasource.username=flash_admin
spring.datasource.password=flash_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# update = auto-creates/updates tables from your @Entity classes.
# Good for dev; switch to Flyway/Liquibase migrations before "production".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- HikariCP connection pool ---
# Default is only 10 connections, which gets saturated fast under a
# genuine flash-sale-style burst (hundreds of simultaneous requests).
# Raising this lets more requests reach the DB layer concurrently instead
# of timing out at the connection-pool level before your app logic runs.
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=10000

# --- Redis (matches docker-compose.yml) ---
spring.data.redis.host=localhost
spring.data.redis.port=6379

# --- Kafka (matches docker-compose.yml, host-accessible listener) ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=flash-sale-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# --- Server ---
server.port=8080

# --- Embedded Tomcat tuning ---
# Defaults (200 threads + 100 accept queue = 300 total capacity) get
# instantly exhausted by a genuine flash-sale burst, causing "connection
# refused" errors before requests even reach your app code. Raising these
# lets the connector actually accept a large simultaneous spike.
server.tomcat.threads.max=400
server.tomcat.accept-count=200
